<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#171b3e"><title>Crypto Tower — Pixel City</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11132e;touch-action:none;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#ui{position:fixed;inset:0;pointer-events:none}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;color:#fff;font-weight:900;text-shadow:2px 3px #302146;font-size:14px}#hud span{background:#151a3cae;border:2px solid #a8b7ec;border-radius:12px;padding:7px 9px;white-space:nowrap}#controls{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:auto}button{border:3px solid #b8c9ff;background:#273b70d9;color:white;border-radius:22px;font-size:34px;font-weight:900;width:78px;height:78px;touch-action:none;box-shadow:0 6px #121b41}button:active{transform:translateY(3px);box-shadow:0 3px #121b41}#overlay{position:absolute;inset:0;background:#0c1235bb;display:flex;align-items:center;justify-content:center;pointer-events:auto}#panel{width:min(84vw,340px);padding:24px 16px;text-align:center;border:4px solid #f9c575;border-radius:16px;background:linear-gradient(#2d376c,#171b42);box-shadow:0 0 0 5px #15112c,0 12px 0 #0e1230;color:#fff}h1{font-size:32px;line-height:1.03;color:#ffca65;text-shadow:3px 4px #b34c56;margin:0 0 12px;letter-spacing:1px}p{font-size:14px;line-height:1.5;color:#e8e9ff}#start{width:auto;height:auto;padding:12px 30px;border-color:#fff1a1;border-radius:12px;background:linear-gradient(#ffda72,#f19a45);color:#523048;font-size:21px;box-shadow:0 5px #a65345}#tag{font-size:11px;letter-spacing:2px;color:#b5e9ff}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="hud"><span id="floor">🏙️ ЭТАЖ 1</span><span id="coins">🪙 0</span><span id="best">🏆 0</span></div><div id="controls"><button id="left" aria-label="Влево">◀</button><button id="right" aria-label="Вправо">▶</button></div><div id="overlay"><div id="panel"><div id="tag">PIXEL CITY • ARCADE</div><h1>CRYPTO<br>TOWER</h1><p id="message">Прыгай по платформам, собирай монеты и поднимайся выше!<br>Управление: ◀ ▶</p><button id="start">▶ ИГРАТЬ</button></div></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');const W=360,H=720;let sx=1,sy=1;function resize(){c.width=Math.round(innerWidth*devicePixelRatio);c.height=Math.round(innerHeight*devicePixelRatio);sx=c.width/W;sy=c.height/H;ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();let seed=92;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const $=id=>document.getElementById(id);let state='menu',player,plats,coins,hazards,particles,camera,maxHeight,score,bank,keys={left:false,right:false},tick=0;let best=0;try{best=Number(localStorage.getItem('ct_best_v05')||0)}catch(e){}$('best').textContent='🏆 '+best;function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function outline(x,y,w,h,col='#211d3d'){rect(x-2,y-2,w+4,h+4,col)}function circle(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#222e70');g.addColorStop(.48,'#7d4d98');g.addColorStop(.77,'#e98783');g.addColorStop(1,'#f6b16f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);circle(262,398,54,'#ffcb91');circle(262,398,42,'#ffe2a3');for(let i=0;i<34;i++){let x=(i*71+43)%W,y=(i*113+18)%360;rect(x,y,2,2,'#d9d8ff')}for(let layer=0;layer<3;layer++){let off=(camera*(.08+layer*.07))%180;for(let i=-2;i<9;i++){let x=i*63+(layer*19)-20,w=42+(i%3)*9,h=100+(i*37+layer*59+500)%150;let y=H-65-h+off;let col=['#55467f','#3a416e','#28365d'][layer];rect(x,y,w,H-y,col);for(let wy=y+16;wy<H;wy+=24)for(let wx=x+9;wx<x+w-5;wx+=17)if((wx+wy+layer)%4!==0)rect(wx,wy,7,10,(wx+wy)%3?'#f9c675':'#65749a')}}}
function wall(x,right){rect(x,0,29,H,'#432b50');rect(x+3,0,23,H,'#9a536c');for(let y=-((camera*.45)%28)-28;y<H+28;y+=28){rect(x+3,y,23,3,'#d78780');rect(x+3,y+14,23,2,'#6b3b5a');let shift=(Math.floor((y+camera*.45)/28)%2)*11;rect(x+shift+13,y+3,2,11,'#6b3b5a');rect(x+shift+2,y+17,2,10,'#6b3b5a')}for(let y=70-((camera*.45)%174);y<H;y+=174){let xx=right?x+4:x+6;outline(xx,y,17,33,'#372842');rect(xx,y,17,33,'#f9bd67');rect(xx+3,y+3,11,27,'#ffdf8c');rect(xx+8,y+2,2,29,'#8c5268');rect(xx,y+15,17,3,'#8c5268');rect(xx-2,y+33,21,4,'#5d3654')}for(let y=155-((camera*.45)%270);y<H;y+=270){rect(x+3,y,21,5,'#365b48');for(let i=0;i<5;i++)circle(x+5+i*4,y-4+(i%2)*3,5,i%2?'#59b76c':'#31876b')}}
function platform(p){let y=p.y-camera;if(y<-30||y>H+30)return;let x=p.x,w=p.w;outline(x,y,w,14,'#362746');rect(x,y,w,5,p.spring?'#f9d5a2':'#8fe38b');rect(x,y+5,w,8,p.spring?'#b96e55':'#6c9b61');rect(x+3,y+13,w-6,4,'#4a765b');for(let i=5;i<w-5;i+=14)rect(x+i,y+2,7,2,'#d8f4a2');if(p.spring){rect(x+w/2-13,y-7,26,7,'#dc4b65');rect(x+w/2-9,y-11,18,4,'#ff9f8b')}}
function coin(o){let y=o.y-camera;if(y<-30||y>H+30||o.got)return;circle(o.x,y,11,'#684265');circle(o.x,y,9,'#ffb22c');circle(o.x,y,7,'#ffe66b');rect(o.x-2,y-5,4,10,'#f7a333');rect(o.x-4,y-3,8,3,'#fff1a5')}
function hazard(o){let y=o.y-camera;if(y<-25||y>H+25)return;rect(o.x,y+9,o.w,5,'#79495b');for(let i=0;i<o.w;i+=14){ctx.fillStyle='#f46b80';ctx.beginPath();ctx.moveTo(o.x+i,y+9);ctx.lineTo(o.x+i+7,y-8);ctx.lineTo(o.x+i+14,y+9);ctx.fill();rect(o.x+i+5,y+3,3,4,'#ffc0a2')}}
function hero(){let x=Math.round(player.x),y=Math.round(player.y-camera),flip=player.vx<-.2;ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);rect(-11,11,10,5,'#392b51');rect(2,11,10,5,'#392b51');rect(-10,9,8,5,'#fff0d1');rect(3,9,8,5,'#fff0d1');rect(-10,-5,20,17,'#2c4b94');rect(-8,-4,16,15,'#4389d7');rect(-13,-4,5,11,'#f2b77c');rect(9,-4,5,11,'#f2b77c');rect(-8,-19,16,16,'#f2b77c');rect(5,-14,4,3,'#2a2b48');rect(-12,-23,23,7,'#a83f4f');rect(-9,-28,16,6,'#e65b57');rect(8,-21,10,4,'#f16c55');rect(-6,-17,4,3,'#ffdb9b');ctx.restore()}
function reset(){seed=(Date.now()%100000)+100;camera=0;maxHeight=0;score=0;bank=0;tick=0;player={x:180,y:565,vx:0,vy:-10};plats=[{x:95,y:608,w:170,spring:false}];coins=[];hazards=[];particles=[];let y=540;while(y>-1800){let w=72+Math.floor(rnd()*35),x=42+rnd()*(W-84-w);plats.push({x,y,w,spring:rnd()<.13});if(rnd()<.63)coins.push({x:x+w/2,y:y-23,got:false});if(rnd()<.13&&y<300)hazards.push({x:x+w*.25,y:y-10,w:w*.5});y-=58+rnd()*31}state='playing';$('overlay').style.display='none';hud()}
function extend(){let top=Math.min(...plats.map(p=>p.y));while(top>camera-950){top-=59+rnd()*32;let w=72+rnd()*37,x=40+rnd()*(W-80-w);plats.push({x,y:top,w,spring:rnd()<.12});if(rnd()<.65)coins.push({x:x+w/2,y:top-24,got:false});if(rnd()<.12&&top<0)hazards.push({x:x+w*.2,y:top-10,w:w*.6})}plats=plats.filter(p=>p.y<camera+H+80);coins=coins.filter(p=>p.y<camera+H+80);hazards=hazards.filter(p=>p.y<camera+H+80)}
function hud(){$('floor').textContent='🏙️ ЭТАЖ '+(1+Math.floor(score/110));$('coins').textContent='🪙 '+bank;$('best').textContent='🏆 '+Math.max(best,score)}function over(){state='over';if(score>best){best=score;try{localStorage.setItem('ct_best_v05',best)}catch(e){}}hud();$('message').innerHTML='Высота: <b>'+score+'</b> · Монеты: <b>'+bank+'</b><br>Попробуй побить рекорд!';$('start').textContent='↻ ЕЩЁ РАЗ';$('overlay').style.display='flex'}
function update(){if(state!=='playing')return;tick++;let oldY=player.y;player.vx+=(keys.left?-1.05:0)+(keys.right?1.05:0);player.vx*=.83;player.vx=Math.max(-5.2,Math.min(5.2,player.vx));player.x+=player.vx;if(player.x<37)player.x=37;if(player.x>323)player.x=323;player.vy+=.43;player.vy=Math.min(12,player.vy);player.y+=player.vy;if(player.vy>0){for(let p of plats){if(oldY+15<=p.y+7&&player.y+15>=p.y&&player.x+10>p.x&&player.x-10<p.x+p.w){player.y=p.y-15;player.vy=p.spring?-14:-11.5;break}}}for(let o of coins){if(!o.got&&Math.abs(o.x-player.x)<18&&Math.abs(o.y-player.y)<24){o.got=true;bank++}}for(let h of hazards){if(player.x+9>h.x&&player.x-9<h.x+h.w&&player.y+14>h.y-8&&player.y-12<h.y+13){over();return}}if(player.y-camera<300)camera=player.y-300;score=Math.max(score,Math.floor((608-player.y)/10));maxHeight=Math.max(maxHeight,score);extend();if(player.y-camera>H+50)over();if(tick%8===0)hud()}
function draw(){ctx.setTransform(sx,0,0,sy,0,0);ctx.imageSmoothingEnabled=false;bg();wall(0,false);wall(331,true);for(let p of plats)platform(p);for(let o of coins)coin(o);for(let h of hazards)hazard(h);if(player)hero();requestAnimationFrame(loop)}function loop(){update();drawFrame()}function drawFrame(){ctx.setTransform(sx,0,0,sy,0,0);ctx.imageSmoothingEnabled=false;bg();wall(0,false);wall(331,true);for(let p of plats||[])platform(p);for(let o of coins||[])coin(o);for(let h of hazards||[])hazard(h);if(player)hero();requestAnimationFrame(loop)}
function bind(id,key){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[key]=false)}bind('left','left');bind('right','right');addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});$('start').addEventListener('click',reset);player={x:180,y:565,vx:0,vy:0};plats=[{x:95,y:608,w:170}];coins=[];hazards=[];camera=0;requestAnimationFrame(loop);})();
</script></body></html>
