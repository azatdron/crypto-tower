<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#171b43"><title>Crypto Tower — Pixel City v0.4</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10132b;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{display:block;width:100vw;height:100dvh;image-rendering:pixelated}#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-weight:900;text-shadow:2px 3px #1c1336;font-size:clamp(12px,3.4vw,18px)}#hud span{background:#101635ba;border:2px solid #c5a9df;border-radius:12px;padding:6px 9px}#controls{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;width:78px;height:78px;border:3px solid #f6dcff99;border-radius:23px;background:#1a214bb8;color:white;font-size:39px;font-weight:bold;touch-action:none;user-select:none}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1030b5;padding:22px}#panel{width:min(360px,94vw);padding:22px;border:4px solid #e9c68b;border-radius:20px;text-align:center;background:linear-gradient(#29326b,#181e46);box-shadow:0 12px 0 #0b102c,0 0 60px #f6a35b55}h1{font-size:37px;line-height:1;margin:0;color:#ffc852;text-shadow:3px 4px #73325c,-2px -2px #fff2bd;letter-spacing:1px}#panel p{line-height:1.5;color:#f7e5d2}#start{border:3px solid #ffe4a0;border-radius:12px;background:linear-gradient(#ffda60,#f2943c);color:#4b2450;font-size:22px;font-weight:1000;padding:13px 25px;box-shadow:0 5px #9d4c39}#small{font-size:12px;color:#e1cfe9;margin-top:18px}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="height">🏆 0 м</span><span id="coins">🪙 0</span><span id="best">⭐ 0</span></div><div id="controls"><button id="left" aria-label="Влево">◀</button><button id="right" aria-label="Вправо">▶</button></div><div id="overlay"><div id="panel"><h1>CRYPTO<br>TOWER</h1><p id="message">PIXEL CITY<br>Прыгай всё выше! Собирай монеты, избегай шипов.</p><button id="start">▶ ИГРАТЬ</button><div id="small">Удерживай ◀ ▶ или касайся левой/правой стороны экрана</div></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);let W=360,H=700,dpr=1,scale=1,world=0,player,platforms=[],coins=[],particles=[],best=Number(localStorage.getItem('ct_best_v04')||0),score=0,bank=0,running=false,last=0,seed=0;const controls={left:false,right:false};const rand=(a,b)=>a+Math.random()*(b-a);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const palette=['#ed9b69','#c96861','#a24d67','#783c67'];function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';scale=innerWidth/360;W=360;H=innerHeight/scale;ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function init(){world=0;score=0;bank=0;seed=0;platforms=[];coins=[];particles=[];const base=H-110;platforms.push({x:115,y:base,w:130,type:'normal',dx:0});player={x:170,y:base-31,w:20,h:30,vx:0,vy:-10,highest:base-31};let y=base;while(y>-H*1.5){y-=rand(54,88);spawn(y)}running=true;$('overlay').style.display='none';last=performance.now();requestAnimationFrame(frame)}function spawn(y){let w=rand(60,102),x=rand(36,324-w);const prev=platforms[platforms.length-1];if(prev&&Math.abs(x-prev.x)>155)x=clamp(prev.x+rand(-125,125),30,330-w);let type=Math.random()<.12?'moving':Math.random()<.07?'spring':Math.random()<.07?'crumble':'normal';let p={x,y,w,type,dx:rand(-.65,.65),used:false};platforms.push(p);if(Math.random()<.67)coins.push({x:x+w/2,y:y-25,taken:false});}function update(dt){let s=Math.min(dt/16.67,2);let oldBottom=player.y+player.h;player.vx+=(controls.right?0.65:0)-(controls.left?0.65:0);player.vx*=.88;player.vx=clamp(player.vx,-5,5);player.x+=player.vx*s;player.x=clamp(player.x,25,335-player.w);player.vy+=.36*s;player.y+=player.vy*s;for(const p of platforms){if(p.type==='moving'){p.x+=p.dx*s;if(p.x<29||p.x+p.w>331)p.dx*=-1}if(player.vy>0&&oldBottom<=p.y+7&&player.y+player.h>=p.y&&player.x+player.w>p.x+5&&player.x<p.x+p.w-5&&!p.used){player.y=p.y-player.h;player.vy=p.type==='spring'?-14:-10.8;if(p.type==='crumble')p.used=true;for(let i=0;i<7;i++)particles.push({x:player.x+10,y:p.y,vx:rand(-2,2),vy:rand(-3,-.5),life:18})}}for(const c of coins){if(!c.taken&&Math.abs(player.x+10-c.x)<20&&Math.abs(player.y+15-c.y)<27){c.taken=true;bank++;for(let i=0;i<10;i++)particles.push({x:c.x,y:c.y,vx:rand(-2.5,2.5),vy:rand(-3,2),life:25})}}for(const q of particles){q.x+=q.vx*s;q.y+=q.vy*s;q.life-=s}particles=particles.filter(q=>q.life>0);let screenY=player.y-world;if(screenY<H*.43){world=player.y-H*.43}score=Math.max(score,Math.floor((H-110-player.y)/10));while(platforms.length&&platforms[platforms.length-1].y>world-120-H)spawn(platforms[platforms.length-1].y-rand(54,88));platforms=platforms.filter(p=>p.y<world+H+80);coins=coins.filter(c=>c.y<world+H+70);$('height').textContent='🏆 '+score+' м';$('coins').textContent='🪙 '+bank;$('best').textContent='⭐ '+Math.max(best,score);if(player.y-world>H+40){running=false;best=Math.max(best,score);localStorage.setItem('ct_best_v04',best);$('message').innerHTML='Высота: <b>'+score+' м</b><br>Монеты: <b>'+bank+'</b><br>Рекорд: <b>'+best+' м</b>';$('start').textContent='↻ ЕЩЁ РАЗ';$('overlay').style.display='flex'}}function background(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#222c77');g.addColorStop(.45,'#844b9d');g.addColorStop(.78,'#f68b83');g.addColorStop(1,'#ffca75');ctx.fillStyle=g;ctx.fillRect(0,0,360,H);for(let i=0;i<55;i++){let x=(i*73+29)%340,y=(i*127+15)%(Math.max(1,H*.65));rect(x,y,2,2,'#eac9df99')}const horizon=H*.75+((world*.07)%130);rect(0,horizon,360,H-horizon,'#c76781');for(let layer=0;layer<3;layer++){const col=['#65467f','#423b72','#28325e'][layer];let par=world*(.08+layer*.06);for(let i=-1;i<13;i++){let x=i*39-layer*13;let bh=65+((i*31+layer*57)%120);let y=horizon+35-bh+(par%30);rect(x,y,34,H-y,col);for(let k=0;k<7;k++)for(let j=0;j<2;j++)if((k+i+j+layer)%3!==0)rect(x+7+j*13,y+11+k*19,5,8,layer===2?'#eab974':'#ad7799')}}}function wall(x){rect(x,0,29,H,'#4c294f');for(let j=-1;j<H/23+2;j++){let y=j*23-((world*.65)%23);rect(x,y,29,2,'#281b3e');rect(x+((j%2)?13:0),y,2,23,'#281b3e');rect(x+2,y+4,24,2,'#985468');rect(x+3,y+8,9,7,'#b86c66')}for(let j=-1;j<H/170+2;j++){let y=j*170-((world*.65)%170)+40;rect(x+5,y,19,35,'#211c46');rect(x+8,y+4,13,26,'#ffcf68');rect(x+10,y+6,9,20,'#ffe6a1');rect(x+13,y+4,2,26,'#7b4263');rect(x+4,y+33,22,4,'#6b3754')}}function platform(p){let y=p.y-world;if(y<-35||y>H+35)return;let x=p.x,w=p.w;rect(x+3,y+8,w-4,10,'#442c55');rect(x,y+4,w,12,p.type==='moving'?'#5b657e':'#995044');rect(x+3,y+9,w-7,5,'#bc7256');rect(x,y,w,7,p.type==='moving'?'#f8bc61':'#4b9e3d');rect(x+2,y,w-4,4,p.type==='moving'?'#ffe18e':'#94e64c');for(let i=8;i<w-7;i+=14){rect(x+i,y+6,7,3,'#3b7c37');rect(x+i+4,y+12,3,3,'#e0a16a')}if(p.type==='spring'){rect(x+w/2-11,y-7,22,7,'#ed594d');for(let k=0;k<3;k++)rect(x+w/2-8,y-5-k*3,16,2,k%2?'#c8d9f8':'#485a8c')}if(p.type==='crumble'){rect(x+w*.46,y+6,2,9,'#392b50');rect(x+w*.62,y+8,2,7,'#392b50')}}function coin(c,t){if(c.taken)return;let y=c.y-world;if(y<-20||y>H+20)return;let x=c.x,b=Math.sin(t*.006+c.x)*2;rect(x-9,y-9+b,18,18,'#743459');rect(x-7,y-10+b,15,18,'#ffad22');rect(x-5,y-8+b,11,14,'#ffe27c');rect(x-1,y-6+b,4,10,'#bd7920');rect(x-4,y-4+b,9,2,'#bd7920');rect(x-4,y+1+b,9,2,'#bd7920')}function boy(){let x=Math.round(player.x),y=Math.round(player.y-world),leg=Math.sin(performance.now()*.025)*3;rect(x+3,y+0,17,5,'#cf383d');rect(x+0,y+5,22,4,'#f04f42');rect(x+7,y+7,13,10,'#f7b17a');rect(x+17,y+9,3,3,'#1d213d');rect(x+3,y+9,5,7,'#663752');rect(x+5,y+17,16,10,'#e24d43');rect(x+10,y+18,3,9,'#ffca8e');rect(x+1,y+19,5,7,'#f7ad79');rect(x+20,y+18,4,7,'#f7ad79');rect(x+7,y+26,6,6+leg,'#3c70c7');rect(x+15,y+26,6,6-leg,'#3c70c7');rect(x+5,y+29+leg,10,4,'#f6f4df');rect(x+14,y+29-leg,10,4,'#f6f4df')}function render(t){background(t);for(const p of platforms)platform(p);for(const c of coins)coin(c,t);boy();for(const q of particles)rect(q.x,q.y-world,4,4,q.life>10?'#ffe482':'#f69a67');wall(0);wall(331);rect(28,0,2,H,'#df9b80');rect(330,0,2,H,'#df9b80')}function frame(t){if(!running)return;let dt=t-last;last=t;update(dt);render(t);if(running)requestAnimationFrame(frame)}function bind(id,key){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);controls[key]=true});for(const evt of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(evt,()=>controls[key]=false)}bind('left','left');bind('right','right');document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')controls.left=true;if(e.key==='ArrowRight'||e.key==='d')controls.right=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')controls.left=false;if(e.key==='ArrowRight'||e.key==='d')controls.right=false});canvas.addEventListener('pointerdown',e=>{controls[e.clientX<innerWidth/2?'left':'right']=true});canvas.addEventListener('pointerup',()=>{controls.left=false;controls.right=false});canvas.addEventListener('pointercancel',()=>{controls.left=false;controls.right=false});$('start').addEventListener('click',init);$('best').textContent='⭐ '+best;player={x:170,y:320,w:20,h:30};platforms=[{x:100,y:420,w:100,type:'normal'}];render(0);})();
</script></body></html>
