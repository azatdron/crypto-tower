<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101a33"><title>Crypto Tower — Pixel City</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101a33;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#wrap{height:100dvh;max-width:520px;margin:auto;position:relative;background:#182744}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.hud{position:absolute;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-weight:900;text-shadow:2px 2px #142033}.hud span{background:#111b30bb;border:2px solid #607ca6;padding:7px;border-radius:8px;font-size:13px}.controls{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}.controls button{pointer-events:auto;border:3px solid #fff6;background:#233d68dd;color:white;border-radius:16px;width:88px;height:72px;font-size:36px;font-weight:900;touch-action:none;user-select:none}.overlay{position:absolute;inset:0;background:#0b1427c9;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.panel{background:#1d3155;border:4px solid #70d7f7;box-shadow:7px 7px 0 #0a1122;padding:24px 18px;width:min(330px,100%)}h1{font-size:32px;line-height:1.05;margin:0 0 14px;color:#ffcd56;text-shadow:3px 3px #bd6539}.panel p{font-size:14px;line-height:1.5}.play{background:#ffc342;border:3px solid #fff;color:#202840;font-size:22px;font-weight:900;padding:13px 32px;border-radius:6px;box-shadow:4px 4px #ad6129;cursor:pointer}.small{font-size:12px;color:#bdd4f4}.hide{display:none}</style></head><body><div id="wrap"><canvas id="game"></canvas><div class="hud"><span id="floor">ЭТАЖ 0</span><span id="coins">🟡 0</span><span id="best">🏆 0</span></div><div class="controls"><button id="left" aria-label="Влево">◀</button><button id="right" aria-label="Вправо">▶</button></div><div class="overlay" id="overlay"><div class="panel"><h1>CRYPTO<br>TOWER</h1><p id="message">PIXEL CITY<br>Прыгай по платформам, собирай монеты и избегай шипов!</p><button class="play" id="start" type="button">▶ ИГРАТЬ</button><p class="small">Удерживай ◀ или ▶<br>Работает в Safari и Telegram</p></div></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),floorEl=document.getElementById('floor'),coinsEl=document.getElementById('coins'),bestEl=document.getElementById('best'),msg=document.getElementById('message');const W=360,H=640;canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false;let player,platforms,items,cam,topY,score,coins,running=false,last=0,keys={left:false,right:false},best=0;try{best=Number(localStorage.getItem('ct_best')||0)}catch(e){}bestEl.textContent='🏆 '+best;function rand(a,b){return a+Math.random()*(b-a)}function init(){player={x:165,y:500,w:24,h:32,vx:0,vy:-10};platforms=[{x:90,y:558,w:180,kind:0}];items=[];cam=0;topY=558;score=0;coins=0;for(let i=0;i<14;i++)spawn();floorEl.textContent='ЭТАЖ 0';coinsEl.textContent='🟡 0';overlay.classList.add('hide');running=true;last=0;requestAnimationFrame(loop)}function spawn(){topY-=rand(65,88);let x=rand(35,245),kind=Math.random()<.15?1:0;platforms.push({x,y:topY,w:rand(75,105),kind,dx:Math.random()<.16?(Math.random()<.5?-0.6:0.6):0});if(Math.random()<.65)items.push({x:x+35,y:topY-25,type:'coin',taken:false});if(Math.random()<.15&&topY<300)items.push({x:x+25,y:topY-13,type:'spike',taken:false})}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function draw(){rect(0,0,W,H,'#1a2c4b');for(let i=0;i<24;i++){let x=(i*97+31)%W,y=((i*131+Math.floor(cam*.12))%H+H)%H;rect(x,y,2,2,'#b6d4ee')}for(let j=0;j<7;j++){let bx=j*63-25,bh=80+(j*79)%170;rect(bx,H-bh,53,bh,'#233c62');for(let y=H-bh+18;y<H-10;y+=23)for(let x=bx+9;x<bx+50;x+=19)rect(x,y,8,11,(x+y)%3<1?'#f7c76b':'#3c567a')}rect(0,0,22,H,'#6c5260');rect(W-22,0,22,H,'#6c5260');for(let y=-(cam%30);y<H;y+=30){rect(0,y,22,3,'#9a7380');rect(W-22,y,22,3,'#9a7380')}for(const p of platforms){let y=p.y-cam;if(y<-25||y>H+20)continue;rect(p.x,y,p.w,10,p.kind?'#f0a85e':'#53d9a3');rect(p.x+5,y+10,p.w-10,6,p.kind?'#98633f':'#238b78');rect(p.x,y,p.w,3,'#c9ffe1')}for(const it of items){if(it.taken)continue;let y=it.y-cam;if(it.type==='coin'){rect(it.x,y,16,16,'#ffd85d');rect(it.x+4,y+3,8,10,'#f6a52c');rect(it.x+7,y+4,2,8,'#fff0aa')}else{rect(it.x,it.y-cam+7,24,7,'#d33c5d');for(let k=0;k<3;k++){ctx.fillStyle='#ff687b';ctx.beginPath();ctx.moveTo(it.x+k*8,y+8);ctx.lineTo(it.x+4+k*8,y-4);ctx.lineTo(it.x+8+k*8,y+8);ctx.fill()}}}let py=player.y-cam;rect(player.x+5,py,14,12,'#f0bd8e');rect(player.x+3,py-5,18,8,'#cf4f5c');rect(player.x+4,py+12,16,14,'#50a5e5');rect(player.x+2,py+26,8,6,'#e7eaf1');rect(player.x+14,py+26,8,6,'#e7eaf1');rect(player.x+16,py+5,3,3,'#182337')}function end(){running=false;overlay.classList.remove('hide');msg.innerHTML='Игра окончена!<br>Этаж: <b>'+score+'</b> · Монеты: <b>'+coins+'</b><br>Рекорд: <b>'+best+'</b>';start.textContent='↻ ЕЩЁ РАЗ'}function update(dt){let prevBottom=player.y+player.h;player.vx=(Number(keys.right)-Number(keys.left))*4.5;player.x=Math.max(22,Math.min(W-22-player.w,player.x+player.vx*dt));player.vy+=0.36*dt;player.y+=player.vy*dt;if(player.vy>0){for(const p of platforms){if(prevBottom<=p.y+7&&player.y+player.h>=p.y&&player.x+player.w>p.x+5&&player.x<p.x+p.w-5){player.y=p.y-player.h;player.vy=-11.5;break}}}for(const p of platforms){if(p.dx){p.x+=p.dx*dt;if(p.x<28||p.x+p.w>W-28)p.dx*=-1}}for(const it of items){if(it.taken)continue;if(player.x+player.w>it.x&&player.x<it.x+(it.type==='coin'?16:24)&&player.y+player.h>it.y-5&&player.y<it.y+17){it.taken=true;if(it.type==='coin'){coins++;coinsEl.textContent='🟡 '+coins}else{end();return}}}if(player.y-cam<235)cam=player.y-235;score=Math.max(score,Math.floor((558-player.y)/65));floorEl.textContent='ЭТАЖ '+score;if(score>best){best=score;bestEl.textContent='🏆 '+best;try{localStorage.setItem('ct_best',String(best))}catch(e){}}while(topY>cam-120)spawn();platforms=platforms.filter(p=>p.y<cam+H+80);items=items.filter(i=>i.y<cam+H+80);if(player.y-cam>H+65)end()}function loop(t){if(!running)return;let dt=last?Math.min((t-last)/16.67,2):1;last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}start.addEventListener('click',init);function bind(id,k){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[k]=false)}bind('left','left');bind('right','right');window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});window.addEventListener('blur',()=>{keys.left=keys.right=false});init();running=false;overlay.classList.remove('hide');draw();})();
</script></body></html>
