<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#241e49"><meta name="apple-mobile-web-app-capable" content="yes"><title>Crypto Tower — Sunset City</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17122d;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#app{height:100dvh;max-width:560px;margin:auto;position:relative;overflow:hidden;background:#271f50}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:10px;right:10px;display:flex;justify-content:space-between;gap:5px;pointer-events:none}.hud span{background:#1c1a41c9;border:2px solid #f9c978;border-radius:12px;padding:7px 8px;font-weight:900;font-size:clamp(11px,3.5vw,17px);text-shadow:1px 2px #3d244b;box-shadow:0 3px 0 #5d3658}.controls{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}.controls button{pointer-events:auto;width:88px;height:86px;border-radius:24px;border:3px solid #f4d5a8;background:#312a62d9;color:#fff5ce;font-size:42px;font-weight:900;box-shadow:0 6px 0 #191330;touch-action:none;user-select:none}.controls button:active{background:#72528a}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#14102bbd;padding:22px}.overlay.hidden{display:none}.panel{width:min(355px,100%);padding:24px 16px;text-align:center;border:5px solid #ffd183;border-radius:23px;background:linear-gradient(#38386e,#201d4b);box-shadow:0 9px 0 #ae5e5a,0 16px 30px #110d2a}.eyebrow{letter-spacing:4px;color:#b6e5ff;font-size:13px}.panel h1{font-size:clamp(37px,11vw,54px);line-height:.94;margin:12px 0;color:#ffd177;text-shadow:4px 5px #aa4d66;font-weight:1000}.panel p{line-height:1.55;color:#f2e9ff}.play{border:3px solid #fff0b8;border-radius:15px;background:linear-gradient(#ffe08a,#f1a452);box-shadow:0 6px #b15c4d;color:#4a2c48;font-size:24px;font-weight:1000;padding:13px 30px}.hint{font-size:12px!important;color:#d4c9e7!important}</style></head><body><div id="app"><canvas id="screen" aria-label="Crypto Tower game"></canvas><div class="hud"><span id="floor">🏙 1 ЭТАЖ</span><span id="coins">🪙 0</span><span id="record">🏆 0</span></div><div class="controls"><button id="left" aria-label="Влево">◀</button><button id="right" aria-label="Вправо">▶</button></div><div class="overlay" id="overlay"><div class="panel"><div class="eyebrow">PIXEL CITY • ARCADE</div><h1>CRYPTO<br>TOWER</h1><p id="message">Прыгай по платформам, собирай золотые монеты и поднимайся над закатным городом!</p><button class="play" id="start">▶ ИГРАТЬ</button><p class="hint">Автоматический прыжок · удерживай ◀ ▶<br>Рекорд сохраняется на устройстве</p></div></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),overlay=document.getElementById('overlay'),msg=document.getElementById('message'),start=document.getElementById('start'),floorEl=document.getElementById('floor'),coinEl=document.getElementById('coins'),recordEl=document.getElementById('record');const W=360,H=720;canvas.width=W;canvas.height=H;g.imageSmoothingEnabled=false;const keys={left:false,right:false};let p,plats,loot,cam,highest,score,coins,best=0,running=false,last=0,clock=0,particles=[],seed=1;try{best=+(localStorage.getItem('crypto_tower_best')||localStorage.getItem('ct_best')||0)}catch(e){}recordEl.textContent='🏆 '+best;function rng(){seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296}function range(a,b){return a+(b-a)*rng()}function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function poly(points,c){g.fillStyle=c;g.beginPath();g.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)g.lineTo(points[i][0],points[i][1]);g.closePath();g.fill()}function ellipse(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}function startGame(){seed=(Date.now()|0)||1;cam=0;clock=0;score=1;coins=0;particles=[];p={x:166,y:560,w:24,h:34,vx:0,vy:-11,face:1};plats=[{x:75,y:618,w:210,type:'grass',dx:0,spike:false}];highest=618;let lastX=180;for(let i=0;i<16;i++)lastX=spawn(lastX);coinEl.textContent='🪙 0';floorEl.textContent='🏙 1 ЭТАЖ';overlay.classList.add('hidden');running=true;last=0;requestAnimationFrame(loop)}function spawn(previousX){highest-=range(62,89);let width=range(69,103);let x=Math.max(24,Math.min(W-width-24,previousX+range(-122,122)));if(rng()<.23)x=range(24,W-width-24);let type=rng()<.22?'brick':'grass';let spike=rng()<.12&&highest<400;let dx=rng()<.13?(rng()<.5?-.35:.35):0;plats.push({x,y:highest,w:width,type,dx,spike});if(rng()<.72)loot.push({x:x+width/2,y:highest-25,taken:false});return x}function resetLoot(){loot=[]}function sky(){let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#29275c');grad.addColorStop(.35,'#6a428b');grad.addColorStop(.68,'#df7391');grad.addColorStop(1,'#ffbd77');g.fillStyle=grad;g.fillRect(0,0,W,H);for(let i=0;i<27;i++){let sx=(i*79+23)%W,sy=(i*117+19)%350;rect(sx,sy,2,2,'#ffe4c3')}ellipse(278,495,66,66,'#ffb76d');ellipse(278,495,52,52,'#ffe4a0');for(let k=0;k<5;k++){let y=410+k*48+Math.sin(k*3)*13;ellipse((k*91+40)%390,y,55,9,k%2?'#d879a1':'#a66a9d');ellipse((k*91+75)%390,y+3,48,7,k%2?'#d879a1':'#a66a9d')}let drift=cam*.13;for(let layer=0;layer<3;layer++){let base=H-25+drift%(layer?220:180),color=['#755381','#513d73','#302f63'][layer];for(let j=0;j<9;j++){let x=j*53-25+layer*16,h=85+((j*67+layer*37)%155);rect(x,base-h,48,240,color);for(let wy=base-h+15;wy<Math.min(base+40,H);wy+=21)for(let wx=x+8;wx<x+45;wx+=15){let on=((j*17+wy*3+wx+layer*11)|0)%5<2;rect(wx,wy,7,10,on?'#ffd383':'#69527c')}}}}function towers(){for(let side=0;side<2;side++){let x=side?W-21:0;rect(x,0,21,H,'#52354e');rect(x+3,0,15,H,'#9b5362');for(let y=-((cam*.65)%29);y<H;y+=29){rect(x,y,21,3,'#dc8a75');rect(x+9,y+3,2,26,'#6e3c58')}for(let y=45;y<H;y+=148){rect(x+4,y,12,29,'#3d2748');rect(x+6,y+2,8,24,'#ffcf76');rect(x+8,y+5,4,17,'#fff0ac')}}}function platform(o){let y=o.y-cam;if(y<-30||y>H+30)return;let x=o.x,w=o.w;if(o.type==='grass'){rect(x+5,y+7,w-9,14,'#63405b');rect(x+2,y+4,w-4,9,'#a65f66');rect(x,y,w,7,'#3d7d52');rect(x,y-4,w,7,'#83db69');for(let i=5;i<w-4;i+=13){rect(x+i,y-6,7,3,'#c3f080');rect(x+i+2,y+7,3,5,'#d68a68')}}else{rect(x+4,y+6,w-8,14,'#7a475d');rect(x,y,w,8,'#e9a46f');rect(x,y-3,w,5,'#ffe4a1');for(let i=9;i<w-5;i+=17)rect(x+i,y+8,2,10,'#a55e62')}if(o.spike){let sx=x+w*.5-14;rect(sx,y-2,28,4,'#8c415c');for(let i=0;i<4;i++)poly([[sx+i*7,y-2],[sx+i*7+3.5,y-17],[sx+i*7+7,y-2]],'#f4a4ac')}}function coin(o){if(o.taken)return;let y=o.y-cam+Math.sin(clock*.09+o.x)*2;if(y<-25||y>H+25)return;ellipse(o.x,y,10,12,'#a75c3c');ellipse(o.x-1,y-2,9,11,'#ffe072');ellipse(o.x-1,y-2,6,8,'#efad38');rect(o.x-3,y-7,3,10,'#fff2ac');rect(o.x+1,y-7,3,10,'#ffe79c')}function hero(){let x=Math.round(p.x),y=Math.round(p.y-cam),step=Math.sin(clock*.45)*2;ellipse(x+12,y+35,12,3,'#3b275b66');rect(x+6,y+9,15,17,'#307db0');rect(x+7,y+10,12,13,'#5ab5d5');rect(x+3,y+10,5,13,'#ed9c6c');rect(x+19,y+10,5,13,'#ed9c6c');rect(x+5,y+24+step,7,8,'#514c85');rect(x+15,y+24-step,7,8,'#514c85');rect(x+3,y+30+step,10,4,'#fff3d2');rect(x+14,y+30-step,10,4,'#fff3d2');rect(x+7,y-1,15,15,'#f8bd83');rect(x+8,y+2,13,11,'#ffd19b');rect(x+7,y+6,3,3,'#a65c48');rect(x+(p.face>0?18:9),y+5,3,3,'#292a51');rect(x+3,y-4,22,7,'#b84e60');rect(x+8,y-9,13,8,'#dc655d');rect(x+11,y-11,6,3,'#ffce83');rect(x+4,y+9,3,4,'#6e3450')}function burst(x,y){for(let i=0;i<8;i++)particles.push({x,y,vx:range(-2,2),vy:range(-3,0),life:25})}function render(){sky();towers();for(const o of plats)platform(o);for(const o of loot)coin(o);for(const q of particles){rect(q.x,q.y-cam,3,3,'#ffeab0')}hero()}function gameOver(){running=false;overlay.classList.remove('hidden');msg.innerHTML='Игра окончена!<br>Этаж: <b>'+score+'</b> · Монеты: <b>'+coins+'</b><br>Рекорд: <b>'+best+'</b>';start.textContent='↻ ЕЩЁ РАЗ'}function update(dt){clock+=dt;let oldBottom=p.y+p.h;let direction=Number(keys.right)-Number(keys.left);if(direction)p.face=direction;p.vx=direction*4.3;p.x=Math.max(21,Math.min(W-21-p.w,p.x+p.vx*dt));p.vy=Math.min(13,p.vy+.38*dt);p.y+=p.vy*dt;for(const o of plats){if(o.dx){o.x+=o.dx*dt;if(o.x<25||o.x+o.w>W-25)o.dx*=-1}}if(p.vy>0){for(const o of plats){if(oldBottom<=o.y+6&&p.y+p.h>=o.y&&p.x+p.w>o.x+7&&p.x<o.x+o.w-7){if(o.spike&&p.x+p.w>o.x+o.w*.5-13&&p.x<o.x+o.w*.5+13){gameOver();return}p.y=o.y-p.h;p.vy=-11.9;burst(p.x+12,o.y);break}}}for(const o of loot){if(!o.taken&&Math.abs(p.x+12-o.x)<19&&Math.abs(p.y+15-o.y)<27){o.taken=true;coins++;coinEl.textContent='🪙 '+coins;burst(o.x,o.y)}}if(p.y-cam<270)cam=p.y-270;score=Math.max(score,Math.floor((618-p.y)/74)+1);floorEl.textContent='🏙 '+score+' ЭТАЖ';if(score>best){best=score;recordEl.textContent='🏆 '+best;try{localStorage.setItem('crypto_tower_best',String(best))}catch(e){}}while(highest>cam-140){let prev=plats[plats.length-1];spawn(prev.x)}plats=plats.filter(o=>o.y<cam+H+100);loot=loot.filter(o=>o.y<cam+H+100);particles=particles.filter(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.12*dt;return --q.life>0});if(p.y-cam>H+55)gameOver()}function loop(t){if(!running)return;let dt=last?Math.min(2,(t-last)/16.67):1;last=t;update(dt);render();if(running)requestAnimationFrame(loop)}function bind(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}});for(const type of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(type,()=>keys[key]=false)}bind('left','left');bind('right','right');addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});addEventListener('blur',()=>{keys.left=keys.right=false});start.addEventListener('click',startGame);resetLoot();startGame();running=false;overlay.classList.remove('hidden');render();})();
</script></body></html>
