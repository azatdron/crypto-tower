<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#30224b"><title>Crypto Tower — Sunset Arcade</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1430;font-family:system-ui;color:white;touch-action:none}#game{display:block;width:100%;height:100dvh;image-rendering:pixelated}.hud{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.hud span{background:#2d234acb;border:2px solid #ffcf8a;border-radius:12px;padding:7px 9px;font-weight:900;text-shadow:2px 2px #51304b}.controls{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 17px);left:15px;right:15px;display:flex;justify-content:space-between}.controls button{width:85px;height:85px;border:3px solid #ffe4a4;border-radius:24px;background:#3d306bbd;color:white;font-size:43px;touch-action:none}.overlay{position:absolute;inset:0;background:#120d28bd;display:grid;place-items:center;padding:22px}.hidden{display:none}.panel{text-align:center;max-width:360px;background:linear-gradient(#464078,#28204e);border:5px solid #ffd78b;border-radius:25px;padding:24px 20px;box-shadow:0 9px #9e5267}.panel h1{font-size:49px;line-height:.92;color:#ffd078;text-shadow:4px 5px #ad5366;margin:15px 0}.panel p{line-height:1.5}.panel button{background:linear-gradient(#ffe68c,#efa557);border:3px solid #fff0b4;border-radius:16px;padding:13px 30px;font-weight:900;font-size:24px;color:#4e2c50}</style></head><body><canvas id="game"></canvas><div class="hud"><span id="floor">ЭТАЖ 1</span><span id="coins">🪙 0</span><span id="best">🏆 0</span></div><div class="controls"><button id="left">◀</button><button id="right">▶</button></div><div id="overlay" class="overlay"><div class="panel"><small>PIXEL SUNSET • ARCADE</small><h1>CRYPTO<br>TOWER</h1><p id="message">Прыгай по платформам, собирай монеты и поднимайся над закатным городом!</p><button id="play">▶ ИГРАТЬ</button><p><small>Автоматические прыжки · удерживай ◀ ▶</small></p></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d');const W=360,H=740;c.width=W;c.height=H;g.imageSmoothingEnabled=false;const $=id=>document.getElementById(id);let best=0;try{best=+(localStorage.getItem('crypto_tower_best')||0)}catch(e){}$('best').textContent='🏆 '+best;let p,platforms,coins,particles,camera,topY,score,count,run=false,last=0,t=0,seed=1;const keys={left:false,right:false};function rnd(){seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296}function rand(a,b){return a+(b-a)*rnd()}function R(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function oval(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()}function tri(x,y,w,h,col){g.fillStyle=col;g.beginPath();g.moveTo(x,y);g.lineTo(x+w/2,y-h);g.lineTo(x+w,y);g.fill()}function newPlatform(prev){topY-=rand(62,80);let w=rand(66,96),x=Math.max(27,Math.min(W-w-27,prev+rand(-120,120)));if(rnd()<.27)x=rand(28,W-w-28);let kind=rnd()<.17?'wood':'grass';platforms.push({x,y:topY,w,kind,spike:rnd()<.09&&topY<400,dx:rnd()<.12?(rnd()<.5?-.28:.28):0});if(rnd()<.78)coins.push({x:x+w/2,y:topY-26,got:false});return x}function start(){seed=Date.now()|0;platforms=[{x:76,y:650,w:208,kind:'grass',spike:false,dx:0}];coins=[];particles=[];topY=650;let x=145;for(let i=0;i<18;i++)x=newPlatform(x);p={x:165,y:595,w:25,h:35,vx:0,vy:-10,face:1};camera=0;score=1;count=0;t=0;last=0;run=true;$('overlay').classList.add('hidden');requestAnimationFrame(loop)}function bg(){let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#282c69');grad.addColorStop(.35,'#704d98');grad.addColorStop(.68,'#e17a98');grad.addColorStop(1,'#ffca84');g.fillStyle=grad;g.fillRect(0,0,W,H);oval(265,475,72,72,'#f6a37e');oval(265,475,54,54,'#ffe0a2');for(let i=0;i<13;i++){let x=(i*87+31)%420-30,y=(i*79+90+camera*.09)%520;oval(x,y,37,8,'#bb77a5');oval(x+22,y+3,30,6,'#d58aa5')}for(let layer=0;layer<3;layer++){let base=H+40+(camera*(.09+layer*.05)%110),col=['#80577d','#604875','#383b6d'][layer];for(let j=0;j<11;j++){let x=j*43-22+layer*11,h=100+(j*43+layer*79)%155;R(x,base-h,39,h,col);for(let yy=base-h+15;yy<Math.min(base,H+20);yy+=19)for(let xx=x+7;xx<x+34;xx+=13){R(xx,yy,6,9,((xx+yy+j)%4<2)?'#ffd18c':'#7a6487')}}}for(let i=0;i<24;i++)R((i*97+11)%W,(i*113+30)%400,2,2,'#ffe6c7')}
function walls(){for(let side=0;side<2;side++){let x=side?W-22:0;R(x,0,22,H,'#583b59');R(x+3,0,16,H,'#a95e69');for(let y=-((camera*.5)%28);y<H;y+=28){R(x,y,22,3,'#e19a7d');R(x+10,y+3,2,25,'#784455')}for(let y=70;y<H;y+=170){R(x+4,y,14,34,'#392a50');R(x+6,y+3,10,27,'#ffcc77');R(x+8,y+6,6,20,'#fff0ae')}}}function platform(a){let y=a.y-camera;if(y<-35||y>H+35)return;let x=a.x,w=a.w;if(a.kind==='grass'){R(x+5,y+5,w-10,16,'#6b4661');R(x+3,y+3,w-6,11,'#a76567');R(x,y-5,w,10,'#55995a');R(x,y-8,w,6,'#a5e97b');for(let i=7;i<w-4;i+=14){R(x+i,y-9,6,3,'#d9f5a0');R(x+i+3,y+4,4,5,'#d38870')}}else{R(x+4,y+4,w-8,16,'#86516a');R(x,y-5,w,11,'#d99568');R(x,y-8,w,5,'#ffe1a0');for(let i=12;i<w;i+=19)R(x+i,y+6,3,9,'#a76268')}if(a.spike){let sx=x+w/2-15;R(sx,y-7,30,4,'#8b435e');for(let i=0;i<4;i++)tri(sx+i*7.5,y-7,7.5,16,'#ff9fae')}}function coin(o){if(o.got)return;let y=o.y-camera+Math.sin(t*.09+o.x)*2;if(y<-25||y>H+25)return;oval(o.x,y,11,13,'#9f583e');oval(o.x-2,y-2,10,12,'#ffe083');oval(o.x-2,y-2,7,9,'#f2b544');R(o.x-4,y-9,3,12,'#fff5b2');R(o.x+2,y-8,3,10,'#fff0a5')}function hero(){let x=Math.round(p.x),y=Math.round(p.y-camera),s=Math.sin(t*.3)*1.5;oval(x+12,y+35,12,3,'#432b5d77');R(x+5,y+15,19,14,'#2c7aa8');R(x+7,y+16,15,12,'#6bb9df');R(x+2,y+15,5,13,'#f1a477');R(x+22,y+15,4,13,'#f1a477');R(x+6,y+28+s,7,7,'#4d4a84');R(x+16,y+28-s,7,7,'#4d4a84');R(x+3,y+32+s,11,5,'#fff3d6');R(x+15,y+32-s,11,5,'#fff3d6');R(x+7,y+1,16,17,'#e8a36d');R(x+8,y+2,15,15,'#ffd4a0');R(x+(p.face>0?19:9),y+8,3,3,'#2b2847');R(x+3,y-3,23,7,'#ad455a');R(x+8,y-10,14,10,'#d85d62');R(x+11,y-12,6,3,'#ffcd8b');R(x+4,y+10,4,5,'#7d3a50')}function burst(x,y){for(let i=0;i<9;i++)particles.push({x,y,vx:rand(-2,2),vy:rand(-3,0),life:22})}function draw(){bg();walls();for(const a of platforms)platform(a);for(const o of coins)coin(o);for(const q of particles)R(q.x,q.y-camera,3,3,'#ffe4a2');hero()}function end(){run=false;$('message').innerHTML='Этаж: <b>'+score+'</b> · Монеты: <b>'+count+'</b><br>Рекорд: <b>'+best+'</b>';$('play').textContent='↻ ЕЩЁ РАЗ';$('overlay').classList.remove('hidden')}function update(dt){t+=dt;let old=p.y+p.h,dir=Number(keys.right)-Number(keys.left);if(dir)p.face=dir;p.vx=dir*4.4;p.x=Math.max(23,Math.min(W-23-p.w,p.x+p.vx*dt));p.vy=Math.min(13,p.vy+.39*dt);p.y+=p.vy*dt;for(const a of platforms)if(a.dx){a.x+=a.dx*dt;if(a.x<25||a.x+a.w>W-25)a.dx*=-1}if(p.vy>0)for(const a of platforms)if(old<=a.y+6&&p.y+p.h>=a.y&&p.x+p.w>a.x+6&&p.x<a.x+a.w-6){if(a.spike&&p.x+p.w>a.x+a.w/2-14&&p.x<a.x+a.w/2+14){end();return}p.y=a.y-p.h;p.vy=-11.8;burst(p.x+12,a.y);break}for(const o of coins)if(!o.got&&Math.abs(p.x+12-o.x)<19&&Math.abs(p.y+15-o.y)<28){o.got=true;count++;burst(o.x,o.y)}if(p.y-camera<285)camera=p.y-285;score=Math.max(score,Math.floor((650-p.y)/74)+1);if(score>best){best=score;try{localStorage.setItem('crypto_tower_best',String(best))}catch(e){}}$('floor').textContent='ЭТАЖ '+score;$('coins').textContent='🪙 '+count;$('best').textContent='🏆 '+best;while(topY>camera-170){let prev=platforms[platforms.length-1];newPlatform(prev.x)}platforms=platforms.filter(a=>a.y<camera+H+90);coins=coins.filter(a=>a.y<camera+H+90);particles=particles.filter(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.13*dt;return --q.life>0});if(p.y-camera>H+55)end()}function loop(ms){if(!run)return;let dt=last?Math.min(2,(ms-last)/16.67):1;last=ms;update(dt);draw();if(run)requestAnimationFrame(loop)}for(const [id,key]of [['left','left'],['right','right']]){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[key]=false)}addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});$('play').onclick=start;start();run=false;$('overlay').classList.remove('hidden');draw()})();
</script></body></html>
