<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#30224b"><title>Crypto Tower — Living City</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1430;font-family:system-ui;color:white;touch-action:none}#game{display:block;width:100%;height:100dvh;image-rendering:pixelated}.hud{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.hud span{background:#2d234acb;border:2px solid #ffcf8a;border-radius:12px;padding:7px 9px;font-weight:900;text-shadow:2px 2px #51304b}.controls{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 10px);left:15px;right:15px;display:flex;justify-content:space-between}.controls button{width:70px;height:70px;border:3px solid #ffe4a4;border-radius:24px;background:#3d306bbd;color:white;font-size:43px;touch-action:none}.tiltbar{position:absolute;top:calc(env(safe-area-inset-top) + 62px);left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:#251b46d9;border:2px solid #ffd78b;border-radius:14px;padding:5px 7px;max-width:95vw;font-size:12px;z-index:2;white-space:nowrap;font-size:12px}.tiltbar button{border:0;border-radius:8px;background:#ffdc87;color:#34234e;font-weight:800;padding:7px}.tiltbar input{width:68px;accent-color:#ffcc72}.tiltbar.hidden{display:none}.overlay{position:absolute;inset:0;background:#120d28bd;display:grid;place-items:center;padding:22px}.hidden{display:none}.panel{text-align:center;max-width:360px;background:linear-gradient(#464078,#28204e);border:5px solid #ffd78b;border-radius:25px;padding:24px 20px;box-shadow:0 9px #9e5267}.panel h1{font-size:49px;line-height:.92;color:#ffd078;text-shadow:4px 5px #ad5366;margin:15px 0}.panel p{line-height:1.5}.panel button{background:linear-gradient(#ffe68c,#efa557);border:3px solid #fff0b4;border-radius:16px;padding:13px 30px;font-weight:900;font-size:24px;color:#4e2c50}</style></head><body><canvas id="game"></canvas><div class="hud"><span id="floor">ЭТАЖ 1</span><span id="coins">🪙 0</span><span id="best">🏆 0</span></div><div class="controls" id="controls"><button id="left">◀</button><button id="right">▶</button></div><div class="tiltbar hidden" id="tiltbar"><span id="tiltstatus">Наклон: выкл.</span><input id="sensitivity" type="range" min="1" max="10" value="5" aria-label="Чувствительность"><button id="calibrate">Центр</button><button id="toggleTilt">Выкл.</button></div><div id="overlay" class="overlay"><div class="panel"><small>SKYLINE EDITION • ARCADE</small><h1>CRYPTO<br>TOWER</h1><p id="message">Прыгай по платформам, собирай монеты и поднимайся над закатным городом!</p><button id="play">▶ ИГРАТЬ</button><p><button id="enableTilt" style="font-size:17px;padding:10px 13px">📱 Включить наклон</button></p><p id="tiltHelp" style="font-size:12px">Разреши датчики движения. Держи телефон перед собой, наклоняй верх влево/вправо и нажми «Центр».</p><p><small>Автопрыжки · наклоняй верх телефона · края соединены</small></p></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d');const W=360,H=740;c.width=W;c.height=H;g.imageSmoothingEnabled=false;const $=id=>document.getElementById(id);let best=0;try{best=+(localStorage.getItem('crypto_tower_best')||0)}catch(e){}$('best').textContent='🏆 '+best;let p,platforms,coins,particles,camera,topY,score,count,run=false,last=0,t=0,seed=1;const keys={left:false,right:false};let tiltEnabled=false,tiltValue=0,tiltCenter=0,tiltSeen=false,tiltRaw=0;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296}function rand(a,b){return a+(b-a)*rnd()}function R(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function oval(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()}function tri(x,y,w,h,col){g.fillStyle=col;g.beginPath();g.moveTo(x,y);g.lineTo(x+w/2,y-h);g.lineTo(x+w,y);g.fill()}function newPlatform(prev){topY-=rand(62,80);let w=rand(66,96),x=Math.max(27,Math.min(W-w-27,prev+rand(-120,120)));if(rnd()<.27)x=rand(28,W-w-28);let kind=rnd()<.17?'wood':'grass';platforms.push({x,y:topY,w,kind,spike:rnd()<.09&&topY<400,dx:rnd()<.12?(rnd()<.5?-.28:.28):0});if(rnd()<.78)coins.push({x:x+w/2,y:topY-26,got:false});return x}function start(){seed=Date.now()|0;platforms=[{x:76,y:650,w:208,kind:'grass',spike:false,dx:0}];coins=[];particles=[];topY=650;let x=145;for(let i=0;i<18;i++)x=newPlatform(x);p={x:165,y:595,w:25,h:35,vx:0,vy:-10,face:1};camera=0;score=1;count=0;t=0;last=0;run=true;$('overlay').classList.add('hidden');requestAnimationFrame(loop)}function bg(){
const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#142a55');sky.addColorStop(.42,'#57558f');sky.addColorStop(.78,'#d88ca4');sky.addColorStop(1,'#f6bb91');g.fillStyle=sky;g.fillRect(0,0,W,H);
// Fixed world-space skyline: buildings remain below as the player climbs.
const horizon=520-camera;
if(horizon>-500&&horizon<H+350){
const sunY=horizon-95;const halo=g.createRadialGradient(265,sunY,8,265,sunY,135);halo.addColorStop(0,'#ffe9aa99');halo.addColorStop(1,'#ffe9aa00');g.fillStyle=halo;g.fillRect(90,sunY-140,270,280);
oval(266,sunY,55,55,'#ffdc9e');
for(let layer=0;layer<3;layer++){let base=horizon+65+layer*62;let color=['#8c668d','#594e80','#293e6b'][layer];for(let j=0;j<10;j++){let bx=j*49-25+layer*17,bh=65+((j*59+layer*31)%115);R(bx,base-bh,46,bh+250,color);R(bx+3,base-bh-4,40,4,layer===2?'#23375f':'#b781a0');for(let wy=base-bh+13;wy<Math.min(H+15,base+110);wy+=17)for(let wx=bx+7;wx<bx+43;wx+=13){let lit=((j*13+wy*3+wx+Math.floor(t/95))%7)<4;R(wx,wy,6,9,lit?'#ffdc94':'#657096')}}}
}
// Higher sky remains clean, with soft clouds and stars rather than repeating buildings.
for(let i=0;i<17;i++){let sx=(i*91+33)%W,sy=((i*127+40+camera*.025)%530+530)%530;let twinkle=.5+.5*Math.sin(t*.045+i*4);g.globalAlpha=.28+twinkle*.5;oval(sx,sy,1.1,1.1,'#fff2dc')}g.globalAlpha=1;
for(let i=0;i<8;i++){let cx=((i*129+t*(.035+i%3*.015))%520)-70;let cy=((i*109+camera*.045)%550+550)%550;g.globalAlpha=.12;oval(cx,cy,35,8,'#fff4ef');oval(cx+22,cy-4,27,9,'#fff4ef');g.globalAlpha=1}
}
function walls(){for(let side=0;side<2;side++){let x=side?W-22:0;R(x,0,22,H,'#583b59');R(x+3,0,16,H,'#a95e69');for(let y=-((camera*.5)%28);y<H;y+=28){R(x,y,22,3,'#e19a7d');R(x+10,y+3,2,25,'#784455')}for(let y=70;y<H;y+=170){R(x+4,y,14,34,'#392a50');R(x+6,y+3,10,27,'#ffcc77');R(x+8,y+6,6,20,'#fff0ae')}}}function platform(a){let y=a.y-camera;if(y<-35||y>H+35)return;let x=a.x,w=a.w;if(a.kind==='grass'){R(x+5,y+5,w-10,16,'#6b4661');R(x+3,y+3,w-6,11,'#a76567');R(x,y-5,w,10,'#55995a');R(x,y-8,w,6,'#a5e97b');for(let i=7;i<w-4;i+=14){R(x+i,y-9,6,3,'#d9f5a0');R(x+i+3,y+4,4,5,'#d38870')}}else{R(x+4,y+4,w-8,16,'#86516a');R(x,y-5,w,11,'#d99568');R(x,y-8,w,5,'#ffe1a0');for(let i=12;i<w;i+=19)R(x+i,y+6,3,9,'#a76268')}if(a.spike){let sx=x+w/2-15;R(sx,y-7,30,4,'#8b435e');for(let i=0;i<4;i++)tri(sx+i*7.5,y-7,7.5,16,'#ff9fae')}}function coin(o){if(o.got)return;let y=o.y-camera+Math.sin(t*.09+o.x)*2;if(y<-25||y>H+25)return;oval(o.x,y,11,13,'#9f583e');oval(o.x-2,y-2,10,12,'#ffe083');oval(o.x-2,y-2,7,9,'#f2b544');R(o.x-4,y-9,3,12,'#fff5b2');R(o.x+2,y-8,3,10,'#fff0a5')}function hero(){
const x=p.x,y=p.y-camera,hop=Math.sin(t*.26)*1.2;
g.save();g.translate(x+12.5,y+18);if(p.face<0)g.scale(-1,1);
// Soft outline and rounded illustrated figure, with arms, sneakers and face.
g.lineJoin='round';g.lineCap='round';
function shape(points,fill,stroke='#44365b',lw=1.4){g.beginPath();points(g);g.fillStyle=fill;g.fill();if(stroke){g.lineWidth=lw;g.strokeStyle=stroke;g.stroke()}}
shape(q=>{q.ellipse(0,16,11,3,0,0,7)},'#1d244e55',null);
shape(q=>{q.moveTo(-8,7);q.lineTo(-9,15+hop);q.lineTo(-2,15+hop);q.lineTo(0,6);q.closePath()},'#3d528f');
shape(q=>{q.moveTo(2,7);q.lineTo(2,15-hop);q.lineTo(9,15-hop);q.lineTo(8,6);q.closePath()},'#38568f');
shape(q=>{q.roundRect(-11,13+hop,10,4,2)},'#fff7e8');shape(q=>{q.roundRect(1,13-hop,11,4,2)},'#fff7e8');
shape(q=>{q.moveTo(-9,-4);q.quadraticCurveTo(-14,1,-11,10);q.lineTo(10,10);q.quadraticCurveTo(14,1,9,-4);q.closePath()},'#56b4d7');
shape(q=>{q.moveTo(-9,-3);q.lineTo(-13,3);q.lineTo(-11,9);q.lineTo(-8,8);q.lineTo(-7,0);q.closePath()},'#f1ae83');
shape(q=>{q.moveTo(9,-3);q.lineTo(13,3);q.lineTo(12,9);q.lineTo(9,8);q.lineTo(7,0);q.closePath()},'#f1ae83');
shape(q=>{q.ellipse(0,-10,10,12,0,0,7)},'#f6bf90');
shape(q=>{q.moveTo(-10,-15);q.quadraticCurveTo(-8,-24,2,-22);q.quadraticCurveTo(10,-23,11,-15);q.lineTo(10,-12);q.quadraticCurveTo(3,-17,-7,-12);q.closePath()},'#6b3c42');
shape(q=>{q.roundRect(-12,-22,24,7,3)},'#d45c64');shape(q=>{q.roundRect(-5,-27,13,8,3)},'#e46c70');
shape(q=>{q.ellipse(4,-10,1.2,1.8,0,0,7)},'#282d47',null);
shape(q=>{q.moveTo(2,-5);q.quadraticCurveTo(5,-3,7,-5)},'#a96062',null);
g.restore();
}
function burst(x,y){for(let i=0;i<9;i++)particles.push({x,y,vx:rand(-2,2),vy:rand(-3,0),life:22})}function draw(){bg();walls();for(const a of platforms)platform(a);for(const o of coins)coin(o);for(const q of particles)R(q.x,q.y-camera,3,3,'#ffe4a2');hero();if(p.x<0){g.save();g.translate(W,0);hero();g.restore()}else if(p.x+p.w>W){g.save();g.translate(-W,0);hero();g.restore()}}function end(){run=false;$('message').innerHTML='Этаж: <b>'+score+'</b> · Монеты: <b>'+count+'</b><br>Рекорд: <b>'+best+'</b>';$('play').textContent='↻ ЕЩЁ РАЗ';$('overlay').classList.remove('hidden')}function update(dt){t+=dt;let old=p.y+p.h,dir=Number(keys.right)-Number(keys.left);if(!dir&&tiltEnabled&&tiltSeen){let delta=tiltRaw-tiltCenter;let dead=2.5;let strength=Number($("sensitivity").value);dir=Math.abs(delta)<dead?0:Math.max(-1,Math.min(1,(Math.abs(delta)-dead)/(24-strength*1.4)))*Math.sign(delta)}if(dir)p.face=Math.sign(dir);p.vx=dir*4.4;p.x+=p.vx*dt;if(p.x>W)p.x=-p.w;else if(p.x+p.w<0)p.x=W;p.vy=Math.min(13,p.vy+.39*dt);p.y+=p.vy*dt;for(const a of platforms)if(a.dx){a.x+=a.dx*dt;if(a.x<25||a.x+a.w>W-25)a.dx*=-1}if(p.vy>0)for(const a of platforms)if(old<=a.y+6&&p.y+p.h>=a.y&&[p.x,p.x-W,p.x+W].some(px=>px+p.w>a.x+6&&px<a.x+a.w-6)){if(a.spike&&p.x+p.w>a.x+a.w/2-14&&p.x<a.x+a.w/2+14){end();return}p.y=a.y-p.h;p.vy=-11.8;burst(p.x+12,a.y);break}for(const o of coins)if(!o.got&&Math.min(Math.abs(p.x+12-o.x),Math.abs(p.x+12-o.x-W),Math.abs(p.x+12-o.x+W))<19&&Math.abs(p.y+15-o.y)<28){o.got=true;count++;burst(o.x,o.y)}if(p.y-camera<285)camera=p.y-285;score=Math.max(score,Math.floor((650-p.y)/74)+1);if(score>best){best=score;try{localStorage.setItem('crypto_tower_best',String(best))}catch(e){}}$('floor').textContent='ЭТАЖ '+score;$('coins').textContent='🪙 '+count;$('best').textContent='🏆 '+best;while(topY>camera-170){let prev=platforms[platforms.length-1];newPlatform(prev.x)}platforms=platforms.filter(a=>a.y<camera+H+90);coins=coins.filter(a=>a.y<camera+H+90);particles=particles.filter(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.13*dt;return --q.life>0});if(p.y-camera>H+55)end()}function loop(ms){if(!run)return;let dt=last?Math.min(2,(ms-last)/16.67):1;last=ms;update(dt);draw();if(run)requestAnimationFrame(loop)}for(const [id,key]of [['left','left'],['right','right']]){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[key]=false)}addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});function onOrientation(e){if(typeof e.gamma!=="number")return;tiltRaw=e.gamma;if(!tiltSeen){tiltCenter=tiltRaw;tiltSeen=true}if(tiltEnabled){$('tiltstatus').textContent='📱 '+Math.round(tiltRaw-tiltCenter)+'°'}}
$('enableTilt').onclick=async()=>{try{if(!('DeviceOrientationEvent' in window))throw Error('Датчик наклона недоступен');if(typeof DeviceOrientationEvent.requestPermission==='function'){const result=await DeviceOrientationEvent.requestPermission();if(result!=='granted')throw Error('Доступ к датчикам не разрешён')}window.addEventListener('deviceorientation',onOrientation);tiltSeen=false;tiltEnabled=true;$('tiltbar').classList.remove('hidden');$('toggleTilt').textContent='Вкл.';$('tiltHelp').textContent='Наклон включён! Нажми «Центр» в удобном положении. Стрелки тоже работают.';setTimeout(()=>{if(!tiltSeen)$('tiltHelp').textContent='Нет данных датчика. Открой игру по HTTPS в Safari и разреши доступ к движению.'},1800)}catch(err){$('tiltHelp').textContent=err.message+' — можно играть стрелками.'}};
$('calibrate').onclick=()=>{if(tiltSeen){tiltCenter=tiltRaw;$('tiltstatus').textContent='📱 0°'}};
$('toggleTilt').onclick=()=>{tiltEnabled=!tiltEnabled;$('toggleTilt').textContent=tiltEnabled?'Вкл.':'Выкл.';$('tiltstatus').textContent=tiltEnabled?'📱 Наклон':'Наклон: выкл.'};
$('play').onclick=start;start();run=false;$('overlay').classList.remove('hidden');draw()})();
</script></body></html>
